<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Navigator — Core & Satellite</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1 class="title">Crash Navigator</h1>
            <p class="subtitle">Core & Satellite Dip Deployment Calculator</p>
        </div>
        <div class="tab-group">
            <button id="tab-sat" class="nav-btn active-sat" onclick="switchPage('sat')">Satellite</button>
            <button id="tab-core" class="nav-btn" onclick="switchPage('core')">Core</button>
        </div>
    </div>

    <!-- Satellite Page -->
    <div id="page-sat" class="page-view is-active">
        <div class="card" style="border-color: var(--sky);">
            <div class="card-header-row">
                <span class="bucket-label text-sky">Satellite Allocation</span>
                <button class="btn-clear" onclick="clearChecks('sat')">Clear Checks</button>
            </div>
            <div class="grid-2">
                <div>
                    <label>Satellite Cash Available ($)</label>
                    <input class="input" type="number" id="sat-cash" min="0" step="100" oninput="update('sat')">
                </div>
                <div>
                    <label>Current Drop (%)</label>
                    <input class="input text-sky" type="number" id="sat-drop" min="0" max="100" step="0.5" oninput="update('sat')">
                </div>
            </div>
            <div class="summary-bar">
                <div class="stat-box">
                    <div class="stat-label">Deployed (Checked)</div>
                    <div class="stat-value text-muted" id="sat-deployed">$0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Remaining Cash</div>
                    <div class="stat-value text-sky" id="sat-remaining">$0</div>
                </div>
            </div>
        </div>

        <div class="card" style="padding: 0.5rem 1rem;">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center" style="width: 44px;">Done</th>
                            <th>Drop</th>
                            <th>Target %</th>
                            <th class="text-right">Deploy Now</th>
                            <th class="text-right">Cumulative</th>
                        </tr>
                    </thead>
                    <tbody id="sat-out"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Core Page -->
    <div id="page-core" class="page-view">
        <div class="card" style="border-color: var(--emerald);">
            <div class="card-header-row">
                <span class="bucket-label text-emerald">Core Allocation</span>
                <button class="btn-clear" onclick="clearChecks('core')">Clear Checks</button>
            </div>
            <div class="grid-2">
                <div>
                    <label>Core Cash Available ($)</label>
                    <input class="input" type="number" id="core-cash" min="0" step="100" oninput="update('core')">
                </div>
                <div>
                    <label>Current Drop (%)</label>
                    <input class="input text-emerald" type="number" id="core-drop" min="0" max="100" step="0.5" oninput="update('core')">
                </div>
            </div>
            <div class="summary-bar">
                <div class="stat-box">
                    <div class="stat-label">Deployed (Checked)</div>
                    <div class="stat-value text-muted" id="core-deployed">$0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Remaining Cash</div>
                    <div class="stat-value text-emerald" id="core-remaining">$0</div>
                </div>
            </div>
        </div>

        <div class="card" style="padding: 0.5rem 1rem;">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="text-center" style="width: 44px;">Done</th>
                            <th>Drop</th>
                            <th>Target %</th>
                            <th class="text-right">Deploy Now</th>
                            <th class="text-right">Cumulative</th>
                        </tr>
                    </thead>
                    <tbody id="core-out"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/script.js"></script>
</body>
</html>
